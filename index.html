<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1f4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Clock In">
<title>Clock In</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div id="login" class="login" hidden>
  <div class="login-card">
    <img src="icons/icon-192.png" alt="" class="login-icon">
    <h1>Clock In</h1>
    <p class="muted">Enter your password</p>
    <form id="loginForm" autocomplete="on">
      <input type="text" name="username" value="worker" autocomplete="username" hidden>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
      <button class="btn primary wide" type="submit">Log in</button>
      <p id="loginErr" class="err" hidden></p>
    </form>
  </div>
</div>

<div id="shell" class="shell" hidden>
  <aside class="side">
    <div class="brand"><img src="icons/icon-192.png" alt=""><span>Clock In</span></div>
    <nav class="nav" id="nav"></nav>
    <button class="nav-out" id="logoutSide"></button>
  </aside>
  <main class="main">
    <section id="v-clock" class="view" hidden></section>
    <section id="v-attendance" class="view" hidden></section>
    <section id="v-settings" class="view" hidden></section>
  </main>
  <nav class="tabs" id="tabs"></nav>
</div>

<div id="sheet" class="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js?v=2"></script>
</body>
</html>
