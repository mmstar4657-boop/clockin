<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1f4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Clock In</title>
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" href="icons/icon-192.png?v=3">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<style>
:root{
  --bg:#eef3fb; --card:#fff; --ink:#0b1f4d; --text:#1e293b; --muted:#64748b; --line:#e3e9f3;
  --navy:#0b1f4d; --navy2:#13306e; --blue:#2563eb; --blue-soft:#e8f0fe;
  --green:#16a34a; --green-soft:#dcfce7; --red:#dc2626; --red-soft:#fee2e2; --amber-soft:#fef3c7;
  --radius:18px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --shadow:0 1px 2px rgba(11,31,77,.06),0 4px 14px -6px rgba(11,31,77,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
h2{font-size:18px;margin:0;font-weight:700;color:var(--ink)}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
.err{color:var(--red);font-size:15px;margin:10px 0 0}

/* shell */
.shell{min-height:100vh}
.side{display:none}
.main{max-width:1120px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 92px)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 0 calc(var(--safe-b) + 6px);z-index:5}
.tabs a{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#94a3b8;font-size:12px;font-weight:600;padding:4px 0}
.tabs a.on{color:var(--blue)}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:236px;background:var(--navy);color:#cbd5e1;padding:22px 14px}
  .brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:20px;padding:0 8px 22px}
  .brand img{width:34px;height:34px;border-radius:9px}
  .nav{display:grid;gap:4px}
  .nav a,.nav-out{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:12px;color:#cbd5e1;text-decoration:none;font-weight:600;font-size:15px;background:none;border:0;font-family:inherit;cursor:pointer;text-align:left}
  .nav a:hover,.nav-out:hover{background:rgba(255,255,255,.06)}
  .nav a.on{background:var(--blue);color:#fff}
  .nav-out{margin-top:auto}
  .main{margin-left:236px;padding:28px 32px 40px}
  .tabs{display:none}
}

/* page header */
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 18px;flex-wrap:wrap}
.ph-l{display:flex;gap:12px;align-items:center}
.ph-ico{width:46px;height:46px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center}
.ph-sub{color:var(--muted);font-size:14px;margin-top:2px}
.badge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--amber-soft);color:#92400e;white-space:nowrap}
.badge.live{background:var(--green-soft);color:#166534}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}

/* buttons */
.btn{appearance:none;border:0;border-radius:12px;padding:13px 18px;font-family:inherit;font-weight:600;font-size:16px;line-height:1.1;background:#e7edf6;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--blue);color:#fff}
.btn.navy{background:var(--navy);color:#fff}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.ghost{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 1.5px #c9d6ea}
.btn.small{padding:9px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%;margin-top:12px}
.btn:disabled{opacity:.5}
.btn:active{transform:scale(.98)}

/* toggles */
.switch{appearance:none;width:52px;height:32px;border-radius:999px;background:#cbd5e1;position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch:checked{background:var(--green)}
.switch:checked::after{left:23px}
.switch:disabled{opacity:.5}
.tog{display:flex;align-items:center;gap:12px}
.tog-ico{width:40px;height:40px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.tog-t{font-weight:700;color:var(--ink)}
.tog-main{flex:1;min-width:0}

/* clock screen */
.top-row{display:grid;gap:16px;margin-bottom:16px}
@media (min-width:900px){.top-row{grid-template-columns:1.4fr 1fr}}
.top-row .card{margin:0}
.result{display:flex;gap:14px;align-items:center;min-height:84px}
.result-icon{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:24px;background:#f1f5f9}
.result-title{font-size:20px;font-weight:800;color:var(--ink)}
.result-sub{font-size:14px;color:var(--muted);margin-top:2px}
.result.ok .result-icon{background:var(--green-soft)}
.result.bad .result-icon{background:var(--red-soft)}
.result.busy .result-icon{background:var(--blue-soft)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid #bfd3fb;border-top-color:var(--blue);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.remind{display:flex;gap:12px;align-items:center;background:var(--amber-soft);color:#78350f;border-radius:14px;padding:12px 14px;margin-bottom:16px;font-weight:600;font-size:15px}
.clock-cards{display:grid;gap:16px}
@media (min-width:700px){.clock-cards{grid-template-columns:1fr 1fr}}
.cc{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.cc-h{display:flex;align-items:center;gap:12px;padding:16px 18px;color:#fff}
.cc-h.in{background:linear-gradient(135deg,#0b1f4d,#1d4ed8)}
.cc-h.out{background:linear-gradient(135deg,#0b1f4d,#334155)}
.cc-h .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.14)}
.cc-h b{font-size:20px;display:block}
.cc-h span{font-size:13px;opacity:.8}
.cc-list{padding:10px;display:grid;gap:8px}
.ag-btn{appearance:none;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;cursor:pointer;font-family:inherit;text-align:left;width:100%;min-height:68px}
.ag-btn:active{transform:scale(.985);background:#f8fafc}
.ag-btn:disabled{opacity:.5}
.ag-btn.open{border-color:#93c5fd;background:#f5f9ff}
.ag-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.ag-main{flex:1;min-width:0}
.ag-name{font-weight:700;font-size:17px;color:var(--ink)}
.ag-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-sub.on{color:var(--blue);font-weight:600}
.ag-go{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.ag-go.in{background:var(--green)} .ag-go.out{background:var(--red)}
.ag-go svg{width:18px;height:18px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}

/* attendance */
.seg{display:inline-flex;background:#e2e8f0;border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-family:inherit;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media (min-width:900px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:12px;align-items:center}
.stat-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.stat-v{font-size:22px;font-weight:800;color:var(--ink);line-height:1.1}
.stat-l{font-size:12px;color:var(--muted);font-weight:600}
table.att{width:100%;border-collapse:collapse;font-size:14px}
table.att th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.att td{padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--text)}
table.att tr:last-child td{border-bottom:0}
.agc{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.agc i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff}
.agc i svg{width:15px;height:15px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:#166534} .pill.bad{background:var(--red-soft);color:#991b1b}
.pill.open{background:var(--blue-soft);color:#1e40af} .pill.warn{background:var(--amber-soft);color:#92400e} .pill.t{background:#f1f5f9;color:#64748b}
.recs{display:flex;gap:6px}
.play{border:0;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:6px 10px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.play svg{width:12px;height:12px;fill:currentColor;stroke:none}
.play.on{background:var(--blue);color:#fff}
.att-cards{display:grid;gap:10px}
.ac{border:1.5px solid var(--line);border-radius:14px;padding:12px}
.ac-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ac-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:14px}
.ac-grid b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.ac-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.wide-only{display:none} .narrow-only{display:block}
@media (min-width:900px){.wide-only{display:block}.narrow-only{display:none}}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px;font-size:14px;color:var(--muted)}

/* settings */
.set-grid{display:grid;gap:16px}
@media (min-width:900px){.set-grid{grid-template-columns:1fr 1fr;align-items:start}}
.set-grid .card{margin:0}
label.f{display:block;font-weight:600;color:var(--ink);margin-bottom:12px;font-size:15px}
input[type=password],input[type=tel],input[type=text],input[type=number]{width:100%;font-size:17px;font-family:inherit;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--text);margin-top:6px}
input:focus{outline:none;border-color:var(--blue)}
.ag-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ag-row:last-of-type{border-bottom:0}
.steps{display:grid;gap:8px;margin:8px 0 10px}
.step{display:flex;align-items:center;gap:6px;background:#f6f8fc;border-radius:12px;padding:6px 6px 6px 10px}
.step-n{font-size:12px;color:var(--muted);width:16px}
.step-kind{font-weight:700;width:48px;color:var(--ink);font-size:15px}
.step input{margin:0;padding:9px;font-size:17px;flex:1;min-width:0}
.step .unit{color:var(--muted);font-size:13px}
.step button{border:0;background:transparent;font-size:16px;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer}
.seq{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.seq-add{display:flex;gap:8px;flex-wrap:wrap}
.swatches,.icons{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.icp{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink);cursor:pointer}
.icp.on{border-color:var(--ink);background:var(--ink);color:#fff}
.msg{font-size:14px;margin:10px 0 0}
.msg.ok{color:#15803d} .msg.bad{color:var(--red)}

/* login */
.login{min-height:92vh;display:grid;place-items:center;padding:20px}
.login-card{width:100%;max-width:380px;text-align:center}
.login-icon{width:84px;height:84px;border-radius:20px;box-shadow:0 6px 16px -6px rgba(11,31,77,.4)}
.login-card h1{margin:14px 0 4px}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(11,31,77,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet-card{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(var(--safe-b) + 18px);animation:up .18s ease-out}
@media (min-width:700px){.sheet{align-items:center}.sheet-card{border-radius:22px}}
.sheet-card h2{font-size:22px;margin-bottom:6px}
@keyframes up{from{transform:translateY(30px);opacity:.7}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;max-width:90vw}

/* boot / fallback (v3) */
.boot-msg{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:15px}
.boot-err .login-card p.small{font-size:12px;color:#64748b;word-break:break-word;margin-top:12px}
.nojs-fail{max-height:0;overflow:hidden;opacity:0;font-size:14px;text-align:center;-webkit-animation:clkShow 0s 8s forwards;animation:clkShow 0s 8s forwards}
.nojs-fail a{color:#2563eb;font-weight:600}
html.clk-ok .nojs-fail{display:none!important}
@-webkit-keyframes clkShow{to{max-height:200px;opacity:1;margin-top:14px}}
@keyframes clkShow{to{max-height:200px;opacity:1;margin-top:14px}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <img src="icons/icon-192.png?v=3" alt="" class="login-icon">
    <h1>Clock In</h1>
    <p class="muted">Enter your password</p>
    <form id="loginForm" autocomplete="on">
      <input type="text" name="username" value="worker" autocomplete="username" hidden>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
      <button class="btn primary wide" type="submit">Log in</button>
      <p id="loginErr" class="err" hidden></p>
    </form>
    <p class="nojs-fail">Couldn't load. <a href="./?r=1">Tap to retry</a></p>
    <noscript><p class="err">This app needs JavaScript. Turn it on in Safari settings, then reload.</p></noscript>
  </div>
</div>

<div id="shell" class="shell" hidden>
  <aside class="side">
    <div class="brand"><img src="icons/icon-192.png?v=3" alt=""><span>Clock In</span></div>
    <nav class="nav" id="nav"></nav>
    <button class="nav-out" id="logoutSide"></button>
  </aside>
  <main class="main">
    <section id="v-clock" class="view" hidden></section>
    <section id="v-attendance" class="view" hidden></section>
    <section id="v-settings" class="view" hidden></section>
  </main>
  <nav class="tabs" id="tabs"></nav>
</div>

<div id="bootMsg" class="boot-msg" hidden>Loading…</div>

<div id="bootErr" class="login boot-err" hidden>
  <div class="login-card">
    <img src="icons/icon-192.png?v=3" alt="" class="login-icon">
    <h1>Clock In</h1>
    <button class="btn primary wide" type="button" onclick="__clkRetry()">Couldn't load, tap to retry</button>
    <p class="small" id="bootErrMsg"></p>
  </div>
</div>

<div id="sheet" class="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
<div id="toast" class="toast" hidden></div>
<script>
(function () {
  var ready = false;
  function el(id) { return document.getElementById(id); }
  function hide(id) { var e = el(id); if (e) e.hidden = true; }
  window.__clkReady = function () {
    ready = true;
    document.documentElement.className += " clk-ok";
    hide("bootErr");
  };
  window.__clkFail = function (e) {
    try { console.error(e); } catch (_) {}
    if (ready) return;
    ready = true;
    document.documentElement.className += " clk-ok";
    var msg = "";
    try { msg = String((e && (e.message || (e.reason && e.reason.message))) || e || "Unknown error"); } catch (_) { msg = "Unknown error"; }
    var m = el("bootErrMsg"); if (m) m.textContent = msg;
    hide("login"); hide("shell"); hide("bootMsg"); hide("sheet");
    var b = el("bootErr"); if (b) b.hidden = false;
  };
  window.__clkRetry = function () {
    try { location.replace(location.pathname + "?r=" + Date.now() + location.hash); } catch (_) { location.reload(); }
  };
  window.addEventListener("error", function (ev) { if (!ready) window.__clkFail(ev.error || ev.message); });
  window.addEventListener("unhandledrejection", function (ev) { if (!ready) window.__clkFail(ev.reason); });
  setTimeout(function () { if (!ready) window.__clkFail(new Error("The app took too long to start")); }, 20000);
})();
</script>

      const table = '<div class="wide-only"><table class="att"><thead><tr><th>Date</th><th>Agency</th><th>Clock in</th><th>Clock out</th><th>Session</th><th>Status</th><th>Recording</th></tr></thead><tbody>\n      '.concat(rows.map((r) => "<tr><td>".concat(fmtDate(r.t), "</td><td>").concat(agCell(r), "</td><td>").concat(tin(r), "</td><td>").concat(tout(r), "</td><td>").concat(len(r), "</td><td>").concat(PILL[r.status]).concat(isTest(r), "</td><td>").concat(recBtns(r), "</td></tr>")).join(""), "\n      </tbody></table></div>");
      const cards = '<div class="narrow-only att-cards">'.concat(rows.map((r) => '<div class="ac">\n      <div class="ac-top">'.concat(agCell(r), "<span>").concat(PILL[r.status]).concat(isTest(r), '</span></div>\n      <div class="ac-grid"><div><b>Date</b>').concat(fmtDayShort(r.t), "</div><div><b>In</b>").concat(tin(r), "</div><div><b>Out</b>").concat(tout(r), '</div></div>\n      <div class="ac-foot"><span class="small muted">Session: <b style="color:var(--ink)">').concat(len(r), "</b></span>").concat(recBtns(r), "</div></div>")).join(""), "</div>");
      $("attBody").innerHTML = table + cards + '<div class="pager"><button class="btn small" data-pg="-1" '.concat(page ? "" : "disabled", ">&#8249; Prev</button><span>Page ").concat(page + 1, " of ").concat(pages, " · ").concat(attRows.length, ' rows</span><button class="btn small" data-pg="1" ').concat(page < pages - 1 ? "" : "disabled", ">Next &#8250;</button></div>");
    }
    document.addEventListener("click", async (e) => {
      const rg = e.target.closest("[data-range]");
      if (rg) {
        range = +rg.dataset.range;
        loadAttendance();
        return;
      }
      const pg = e.target.closest("[data-pg]");
      if (pg) {
        page += +pg.dataset.pg;
        drawAttendance();
        document.getElementById("attBody").scrollIntoView({ block: "start", behavior: "smooth" });
        return;
      }
      const pl = e.target.closest("[data-play]");
      if (pl) {
        const id = pl.dataset.play;
        if (audio && playingKey === id) {
          audio.pause();
          return;
        }
        if (audio) audio.pause();
        pl.disabled = true;
        try {
          const r = await api("/recording/" + id, { raw: true });
          if (!r.ok) throw new Error("Recording not available yet");
          const url = URL.createObjectURL(await r.blob());
          audio = new Audio(url);
          playingKey = id;
          drawAttendance();
          const stop = () => {
            if (playingKey === id) {
              playingKey = null;
              drawAttendance();
            }
            URL.revokeObjectURL(url);
          };
          audio.onended = stop;
          audio.onpause = stop;
          await audio.play();
        } catch (err) {
          toast(err.message);
          playingKey = null;
          drawAttendance();
        }
      }
    });
    function drawSettings() {
      if (!S) return;
      const s = S.settings, ags = S.agencies || [];
      const notif = "Notification" in window ? Notification.permission : "unsupported";
      $("v-settings").innerHTML = '\n      <div class="ph"><div class="ph-l"><div class="ph-ico">'.concat(ic("sliders"), '</div><div><h1>Settings</h1><div class="ph-sub">Agencies, phone numbers and keys</div></div></div>\n        <span class="badge ').concat(S.mode === "test" ? "" : "live", '">').concat(S.mode === "test" ? "Test mode" : "Live", '</span></div>\n      <div class="set-grid">\n        <div class="card">\n          <div class="card-h"><h2>Agencies</h2><button class="btn small primary" id="addAg">').concat(ic("plus"), "Add</button></div>\n          ").concat(ags.map((a) => '<div class="ag-row">'.concat(agIco(a), '<div class="ag-main"><div class="ag-name">').concat(esc(a.name), '</div><div class="ag-sub">').concat(esc(pretty(a.clock_number)), " · in ").concat(a.in_steps.length, " steps, out ").concat(a.out_steps.length, ' steps</div></div><button class="btn small ghost" data-edit="').concat(a.id, '">Edit</button></div>')).join("") || '<div class="empty">No agencies yet</div>', '\n        </div>\n        <div>\n          <form class="card" id="setForm" novalidate>\n            <h2 style="margin-bottom:12px">You</h2>\n            <label class="f">Your cell<input id="workerCell" type="tel" inputmode="tel" value="').concat(esc(pretty(s.worker_cell)), '" placeholder="(555) 555-0123"><span class="muted small" style="font-weight:400">Rings you for "Listen live" and test calls</span></label>\n            <div class="seq">\n              <label class="tog"><span class="tog-ico">').concat(ic("bell"), '</span><span class="tog-main"><span class="tog-t" style="display:block">Remind me to clock out</span><span class="muted small">Only a reminder. It never calls.</span></span><input id="remindOut" type="checkbox" class="switch" ').concat(s.remind_out ? "checked" : "", '></label>\n              <label class="f" style="margin-top:12px">Remind me after (hours clocked in)<input id="remindHours" type="number" inputmode="decimal" min="0.5" max="24" step="0.5" value="').concat(esc(s.remind_hours), '"></label>\n              ').concat(notif === "default" ? '<button type="button" class="btn small ghost" id="askNotif">Allow notifications</button>' : notif === "granted" ? '<span class="muted small">Notifications are on. You’ll also see a banner on the Clock screen.</span>' : '<span class="muted small">You’ll see a banner on the Clock screen. (On iPhone, add the app to your Home Screen to allow notifications.)</span>', '\n            </div>\n            <div class="seq">\n              <label class="tog"><span class="tog-ico">').concat(ic("flask"), '</span><span class="tog-main"><span class="tog-t" style="display:block">Test mode</span><span class="muted small">').concat(S.telnyxReady ? "On: calls are simulated. Off: real calls." : "On until the phone line is connected. Calls are simulated.", '</span></span><input id="forceTest" type="checkbox" class="switch" ').concat(!S.telnyxReady || s.force_test ? "checked" : "", " ").concat(S.telnyxReady ? "" : "disabled", '></label>\n            </div>\n            <button class="btn primary wide" type="submit" id="saveBtn">Save</button>\n            <p id="setMsg" class="msg" hidden></p>\n          </form>\n          <div class="card">\n            <h2>Test history</h2>\n            <p class="muted small">Removes every Test-mode entry from Attendance (sample data and simulated calls). Real calls are kept.</p>\n            <button class="btn danger wide" id="clearTest">Clear test history</button>\n          </div>\n          <button class="btn ghost wide" id="logoutBtn">').concat(ic("logout"), "Log out</button>\n        </div>\n      </div>");
      $("logoutBtn").onclick = logout;
      $("addAg").onclick = () => editAgency(null);
      if ($("askNotif")) $("askNotif").onclick = async () => {
        try {
          await Notification.requestPermission();
        } catch (_) {
        }
        drawSettings();
      };
      $("clearTest").onclick = async () => {
        if (!await confirmSheet("Clear test history?", "Removes all Test-mode entries. Real calls are kept.", "Clear")) return;
        try {
          const d = await api("/history/test", { method: "DELETE" });
          toast("Removed ".concat(d.deleted, " test entries"));
          await loadState();
        } catch (err) {
          toast(err.message);
        }
      };
      $("setForm").onsubmit = async (e) => {
        e.preventDefault();
        $("saveBtn").disabled = true;
        try {
          const d = await api("/settings", { method: "PUT", body: { worker_cell: $("workerCell").value, listen_live: !!S.settings.listen_live, force_test: S.telnyxReady ? $("forceTest").checked : false, remind_out: $("remindOut").checked, remind_hours: Number($("remindHours").value) } });
          S.settings = d.settings;
          S.mode = d.mode;
          if (d.settings.remind_out && "Notification" in window && Notification.permission === "default") {
            try {
              await Notification.requestPermission();
            } catch (_) {
            }
          }
          drawSettings();
          const m = $("setMsg");
          m.textContent = "Saved ✓";
          m.className = "msg ok";
          m.hidden = false;
        } catch (err) {
          const m = $("setMsg");
          m.textContent = err.message;
          m.className = "msg bad";
          m.hidden = false;
        } finally {
          if ($("saveBtn")) $("saveBtn").disabled = false;
        }
      };
    }
    document.addEventListener("click", (e) => {
      const b = e.target.closest("[data-edit]");
      if (b) editAgency(b.dataset.edit);
    });
    let ed = null;
    function editAgency(id) {
      const a = id ? agById(id) : null;
      ed = a ? JSON.parse(JSON.stringify(a)) : { id: null, name: "", icon: "briefcase", color: "#2563eb", clock_number: "", in_steps: [{ t: "wait", s: 4 }, { t: "press", d: "1" }], out_steps: [{ t: "wait", s: 4 }, { t: "press", d: "2" }] };
      $("sheet").dataset.lock = "1";
      sheet("<h2>".concat(a ? "Edit agency" : "Add agency", '</h2>\n      <label class="f">Name<input id="eName" type="text" value="').concat(esc(ed.name), '" placeholder="Agency name" maxlength="40"></label>\n      <div class="f" style="font-weight:600;color:var(--ink)">Icon</div><div class="icons" id="eIcons"></div>\n      <div class="f" style="font-weight:600;color:var(--ink)">Color</div><div class="swatches" id="eColors"></div>\n      <label class="f">Clock-in phone number<input id="eNum" type="tel" inputmode="tel" value="').concat(esc(pretty(ed.clock_number)), '" placeholder="(555) 555-0100"></label>\n      <div class="seq"><h2>Clock-in keys</h2><div class="steps" id="eIn"></div>\n        <div class="seq-add"><button type="button" class="btn ghost small" data-add="in_steps" data-t="wait">+ Wait</button><button type="button" class="btn ghost small" data-add="in_steps" data-t="press">+ Press keys</button></div></div>\n      <div class="seq" style="margin-top:14px"><h2>Clock-out keys</h2><div class="steps" id="eOut"></div>\n        <div class="seq-add"><button type="button" class="btn ghost small" data-add="out_steps" data-t="wait">+ Wait</button><button type="button" class="btn ghost small" data-add="out_steps" data-t="press">+ Press keys</button></div></div>\n      <button class="btn primary wide" id="eSave">Save</button>\n      <p id="eMsg" class="msg" hidden></p>\n      ').concat(a ? '<div class="seq" style="margin-top:16px"><h2>Test call</h2><p class="muted small">Rings your cell and plays '.concat(esc(a.name), '\'s clock-in keys to you, so you can check the timing. Nothing is sent to the clock-in line. Save changes first.</p>\n        <button class="btn wide" data-test="').concat(a.id, '">').concat(ic("phone"), 'Make a test call</button><p id="tMsg" class="msg" hidden></p>\n        <button class="btn danger wide" id="eDel">Remove agency</button></div>') : "", '\n      <button class="btn ghost wide" id="eClose">Close</button>'));
      drawEd();
      $("eClose").onclick = () => {
        delete $("sheet").dataset.lock;
        closeSheet();
      };
      $("eSave").onclick = saveAgency;
      if ($("eDel")) $("eDel").onclick = async () => {
        if (!confirm("Remove ".concat(a.name, "? Its history stays in Attendance."))) return;
        try {
          await api("/agencies/" + a.id, { method: "DELETE" });
          await loadState();
          delete $("sheet").dataset.lock;
          closeSheet();
          drawSettings();
          toast("Removed");
        } catch (err) {
          emsg(err.message, false);
        }
      };
    }
    function emsg(t, ok, el = "eMsg") {
      const m = $(el);
      if (!m) return;
      m.textContent = t;
      m.className = "msg " + (ok ? "ok" : "bad");
      m.hidden = false;
    }
    function drawEd() {
      $("eIcons").innerHTML = AG_ICONS.map((n) => '<button type="button" class="icp'.concat(ed.icon === n ? " on" : "", '" data-icon="').concat(n, '" aria-label="').concat(n, '">').concat(ic(n), "</button>")).join("");
      $("eColors").innerHTML = COLORS.map((c) => '<button type="button" class="sw'.concat(ed.color === c ? " on" : "", '" data-color="').concat(c, '" style="background:').concat(c, '" aria-label="color"></button>')).join("");
      for (const [k, el] of [["in_steps", "eIn"], ["out_steps", "eOut"]]) {
        $(el).innerHTML = ed[k].map((s, i) => '<div class="step" data-k="'.concat(k, '" data-i="').concat(i, '"><span class="step-n">').concat(i + 1, '</span><span class="step-kind">').concat(s.t === "wait" ? "Wait" : "Press", "</span>\n        ").concat(s.t === "wait" ? '<input type="number" inputmode="decimal" min="0.5" max="30" step="0.5" value="'.concat(esc(s.s), '" data-f="s" aria-label="Seconds"><span class="unit">sec</span>') : '<input type="text" inputmode="tel" value="'.concat(esc(s.d), '" data-f="d" aria-label="Keys" placeholder="e.g. 123456#">'), '\n        <button type="button" data-mv aria-label="Move up">&#8593;</button><button type="button" data-del aria-label="Remove">&#10005;</button></div>')).join("") || '<div class="muted small">No steps yet</div>';
      }
    }
    document.addEventListener("input", (e) => {
      if (!ed) return;
      if (e.target.id === "eName") ed.name = e.target.value;
      if (e.target.id === "eNum") ed.clock_number = e.target.value;
      const row = e.target.closest(".step");
      if (!row) return;
      const s = ed[row.dataset.k][+row.dataset.i];
      if (e.target.dataset.f === "s") s.s = Number(e.target.value);
      if (e.target.dataset.f === "d") s.d = e.target.value.replace(/\s/g, "");
    });
    document.addEventListener("click", async (e) => {
      if (!ed || $("sheet").hidden) return;
      const t = e.target;
      const icn = t.closest("[data-icon]");
      if (icn) {
        ed.icon = icn.dataset.icon;
        drawEd();
        return;
      }
      const col = t.closest("[data-color]");
      if (col) {
        ed.color = col.dataset.color;
        drawEd();
        return;
      }
      const add = t.closest("[data-add]");
      if (add) {
        ed[add.dataset.add].push(add.dataset.t === "wait" ? { t: "wait", s: 2 } : { t: "press", d: "" });
        drawEd();
        return;
      }
      const row = t.closest(".step");
      if (row) {
        const list = ed[row.dataset.k], i = +row.dataset.i;
        if (t.closest("[data-del]")) {
          list.splice(i, 1);
          drawEd();
        } else if (t.closest("[data-mv]") && i > 0) {
          [list[i - 1], list[i]] = [list[i], list[i - 1]];
          drawEd();
        }
        return;
      }
      const tb = t.closest("[data-test]");
      if (tb && !busy) {
        const ag = agById(tb.dataset.test);
        emsg("Starting test call...", true, "tMsg");
        const a = await placeCall("test", ag.id, (a2) => emsg(a2.stage || "Calling...", a2.status !== "failed", "tMsg"));
        emsg(a.status === "done" ? "✅ Test call finished. Recording is in Attendance history." : "❌ " + (a.stage || "Test call failed"), a.status === "done", "tMsg");
      }
    });
    async function saveAgency() {
      $("eSave").disabled = true;
      try {
        const body = { name: ed.name, icon: ed.icon, color: ed.color, clock_number: ed.clock_number, in_steps: ed.in_steps, out_steps: ed.out_steps };
        const d = ed.id ? await api("/agencies/" + ed.id, { method: "PUT", body }) : await api("/agencies", { method: "POST", body });
        await loadState();
        const wasNew = !ed.id;
        ed = JSON.parse(JSON.stringify(d.agency));
        emsg("Saved ✓", true);
        drawSettings();
        if (wasNew) {
          delete $("sheet").dataset.lock;
          closeSheet();
          toast("".concat(d.agency.name, " added"));
        }
      } catch (err) {
        emsg(err.message, false);
      } finally {
        if ($("eSave")) $("eSave").disabled = false;
      }
    }
    function regSW() {
      try {
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=3").catch(() => {
        });
      } catch (_) {
      }
    }
    if (token) {
      $("login").hidden = true;
      $("bootMsg").hidden = false;
    }
    (async () => {
      if (token) {
        try {
          await loadState();
        } catch (_) {
        }
      }
      $("bootMsg").hidden = true;
      route();
      window.__clkReady();
      if (token) {
        try {
          await notifyOverdue();
        } catch (_) {
        }
      }
      setTimeout(regSW, 4e3);
    })().catch((e) => window.__clkFail(e));
  })();
} catch (e) {
  window.__clkFail(e);
}
</script>
</body>
</html>
